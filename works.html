<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Works — Portfolio</title>

    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Kirang+Haerang&family=Notable&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #146a9c !important;
            color: #f5f0df;
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
        }

        .works-title-container {
            position: absolute;
            left: 5%;
            top: 46%;
            transform: translateY(-50%);
            width: max-content;
            z-index: 5;
            --title-size: clamp(130px, 10vw, 310px);
        }

        .works-title {
            position: relative;
            margin: 0;
            padding: 0;
            font-family: 'Notable', sans-serif;
            font-size: var(--title-size);
            font-weight: 400;
            line-height: 0.85;
            color: #f5f0df;
            white-space: nowrap;
        }

        .navigation {
            opacity: 1;
            animation: none;
        }

        .works-gallery {
            position: fixed;
            left: 5%;
            bottom: 15%;
            height: 25vh;
            display: flex;
            width: fit-content;
            max-width: 90vw;
            gap: 5px;
            justify-content: flex-start;
            align-items: stretch;
        }

        .work-rectangle {
            position: relative;
            flex: 0 0 7vw;
            min-width: 0;
            background-color: #b2d8f0;
            overflow: hidden;
            transition: flex 0.2s ease;
        }

        .work-rectangle img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: filter 0.2s ease;
        }

        /* Velo sulle immagini non selezionate */
        .work-rectangle::after {
            content: "";
            position: absolute;
            inset: 0;
            background-color: rgba(147, 105, 194, 0.219);
            opacity: 1;
            transition: opacity 0.2s ease;
            pointer-events: none;
        }

        .work-rectangle.active::after {
            opacity: 0;
        }

        /* Titolo del progetto */
        .work-title {
            position: absolute;
            left: 12px;
            bottom: 12px;
            margin: 0;
            color: #ffffff;
            font-family: 'Kirang Haerang', cursive;
            font-size: clamp(24px, 2.2vw, 44px);
            line-height: 1;
            white-space: normal;
            overflow-wrap: break-word;
            max-width: calc(100% - 24px);
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
            z-index: 1;
            mix-blend-mode: normal;
        }

        .work-title-special {
            color: #000000;
            mix-blend-mode: normal;
        }

        .work-rectangle:hover::after {
            opacity: 0;
        }

        .work-rectangle:hover .work-title {
            opacity: 1;
        }

        .works-gallery:hover .work-rectangle {
            flex: 0 0 7vw;
        }

        .works-gallery .work-rectangle:hover {
            flex: 0 0 34vw;
        }

        .works-gallery:has(.work-rectangle:hover) .work-rectangle:not(:hover) {
            flex: 0 0 3vw;
        }

        .works-gallery .work-rectangle {
            flex: 0 0 7vw;
        }

        .works-gallery .work-rectangle.active {
            flex-basis: 34vw;
        }

        .works-gallery:has(.work-rectangle.active) .work-rectangle:not(.active) {
            flex-basis: 3vw;
        }

        .work-rectangle.active .work-title {
            opacity: 1;
        }

        .works-controls {
            position: fixed;
            left: 5%;
            bottom: 7%;
            display: flex;
            gap: 18px;
            z-index: 10;
        }

        .works-controls button {
            background: none;
            border: none;
            padding: 0;
            color: #f5f0df;
            font-family: 'Kirang Haerang', cursive;
            font-size: 84px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .works-controls button:hover {
            transform: scale(1.2);
        }

        #fisherman {
            position: absolute;
            width: calc(var(--title-size) * 9.5);
            left: calc(var(--title-size) * -0.3);
            top: calc(var(--title-size) * -2.08);
            height: auto;
            z-index: 6;
            pointer-events: none;
        }

        #fisherman img {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Scena responsive per la pagina Works */
        body:has(.works-title-container) #scene {
            width: 100vw;
            height: 100vh;
            left: 0;
            top: 0;
            margin: 0;
        }

        /* Wrapper dimensionato sulla larghezza effettiva della scritta */
        .works-heading {
            position: relative;
            display: inline-block;
            width: max-content;
        }

        .works-heading .works-title {
            display: block;
            width: max-content;
        }

        /* Scroll-prompt ancorato al titolo */
        body:has(.works-title-container) .works-heading .scroll-prompt {
            position: absolute !important;
            display: block !important;
            visibility: visible !important;
            left: 100% !important;
            top: 50% !important;
            right: auto !important;
            bottom: auto !important;
            transform: translate(20px, -50%) !important;
            animation: none !important;
            opacity: 1 !important;
            z-index: 20 !important;
            pointer-events: none;
        }

        body:has(.works-title-container) .works-heading .scroll-prompt .scroll-frame {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            right: auto !important;
            bottom: auto !important;
            margin: 0 !important;
            transform: none !important;
        }

        /* Sottopagina del progetto */
        #project-page {
            position: fixed;
            inset: 0;
            z-index: 1000;
            overflow-y: auto;
            overflow-x: hidden;
            overscroll-behavior-y: contain;
            background-color: #34343A;
            color: #f5f0df;
            transform: translateY(100%);
            visibility: hidden;
            transition: transform 1.1s ease, visibility 0s linear 1.1s;
        }

        #project-page.open {
            transform: translateY(0);
            visibility: visible;
            transition: transform 1.1s ease, visibility 0s;
        }

        /* Frecce fisse tra le sottopagine */
        .project-page-arrow {
            position: fixed;
            top: 50%;
            z-index: 1001;
            width: 54px;
            height: 70px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            color: #f5f0df;
            font-size: 32px;
            line-height: 1;
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transform: translateY(calc(-50% + 40px));
            transition:
                opacity 0.4s ease,
                transform 0.4s ease,
                visibility 0s linear 1.1s;
        }

        #prev-project-page {
            left: 16px;
        }

        #next-project-page {
            right: 16px;
        }

        body:has(#project-page.open) .project-page-arrow {
            opacity: 0.7;
            visibility: visible;
            transform: translateY(-50%);
            transition:
                opacity 0.4s ease 0.6s,
                transform 0.4s ease 0.6s,
                visibility 0s;
        }

        body:has(#project-page.open) .project-page-arrow:hover {
            opacity: 1;
        }

        /* Pulsante di chiusura */
        #close-project-page {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 1002;
            width: 64px;
            height: 64px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            color: #f5f0df;
            font-size: 44px;
            line-height: 1;
            cursor: pointer;
            visibility: hidden;
            opacity: 0;
            transform: translateY(40px);
            transition:
                opacity 0.5s ease,
                transform 0.5s ease,
                visibility 0s linear 1.1s;
        }

        body:has(#project-page.open) #close-project-page {
            visibility: visible;
            opacity: 1;
            transform: translateY(0);
            transition:
                opacity 0.5s ease 0.6s,
                transform 0.5s ease 0.6s,
                visibility 0s;
        }

        /* Contenuto verticale */
        .project-page-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            width: min(1100px, 85%);
            margin: 0 auto;
            padding: 100px 0 60px;
            box-sizing: border-box;
        }

        #project-page-title {
            width: 100%;
            margin: 0;
            font-family: 'Notable', sans-serif;
            font-size: clamp(42px, 7vw, 100px);
            font-weight: 400;
            line-height: 1.1;
            text-align: center;
            overflow-wrap: anywhere;
        }

        /* Player YouTube */
        .project-page-video {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #24242A;
        }

        .project-page-video iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Anteprima YouTube */
        .youtube-preview {
            position: relative;
            display: block;
            width: 100%;
            height: 100%;
            padding: 0;
            overflow: hidden;
            border: 0;
            background: #24242A;
            cursor: pointer;
        }

        .youtube-thumbnail {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.25s ease;
        }

        .youtube-preview:hover .youtube-thumbnail {
            transform: scale(1.03);
        }

        .youtube-play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 76px;
            height: 54px;
            border-radius: 14px;
            background: rgba(220, 0, 0, 0.92);
            color: white;
            font-size: 28px;
            transform: translate(-50%, -50%);
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .youtube-preview:hover .youtube-play-icon {
            background: #f00;
            transform: translate(-50%, -50%) scale(1.08);
        }

        /* Descrizione progetto */
        .project-page-description {
            width: min(100%, 800px);
            font-family: 'Kirang Haerang', cursive;
            font-size: clamp(22px, 2.5vw, 32px);
            line-height: 1.35;
            overflow-wrap: anywhere;
            text-align: justify;
        }

        /* Impedisce la selezione del testo */
        * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* Impedisce il trascinamento delle immagini */
        img {
            -webkit-user-drag: none;
            user-drag: none;
        }

        /* Fascia di sfondo del menu mobile */
        .mobile-nav-band {
            display: none;
        }

        @media (max-width: 700px) {
            .project-page-content {
                width: 90%;
                gap: 28px;
                padding-top: 90px;
                padding-bottom: 40px;
            }

            #project-page-title {
                font-size: clamp(32px, 9vw, 60px);
            }

            .project-page-description {
                font-size: 24px;
            }

            #close-project-page {
                top: 10px;
                right: 10px;
            }

            .project-page-arrow {
                width: 36px;
                font-size: 24px;
            }

            #prev-project-page {
                left: 2px;
            }

            #next-project-page {
                right: 2px;
            }
        }

        @media (max-width: 600px) {
            /* Menu mobile centrato */
            .navigation {
                position: fixed;
                top: 16px;
                left: 50%;
                right: auto;
                width: max-content;
                max-width: calc(100vw - 24px);
                box-sizing: border-box;
                display: flex;
                flex-direction: row;
                justify-content: center;
                align-items: center;
                gap: 8px;
                padding: 0;
                margin: 0;
                transform: translateX(-50%);
                z-index: 1000;
                opacity: 1;
                animation: none;
                white-space: nowrap;
            }

            .navigation a {
                box-sizing: border-box;
                padding: 8px 12px;
                font-size: 1.08em;
                white-space: nowrap;
            }

            #fisherman {
                pointer-events: auto !important;
                cursor: pointer;
            }

            #scroll-prompt {
                display: none !important;
            }

            /* Titolo: centrato, più in alto e contenuto nello schermo */
            .works-title-container {
                position: absolute;
                top: 22% !important;
                left: 50% !important;
                width: 94vw;
                transform: translate(-50%, -50%) !important;
                --title-size: clamp(40px, 15vw, 90px);
            }

            .works-heading {
                width: 100%;
            }

            .works-heading .works-title {
                width: 100%;
                max-width: 100%;
                font-size: min(var(--title-size), 18vw);
                line-height: 0.9;
                text-align: center;
                white-space: nowrap;
            }

            /* Pescatore spostato a sinistra, mantenendo la posizione verticale */
            #fisherman {
                left: calc(var(--title-size) * -3.3) !important;
                top: calc(var(--title-size) * -2.08) !important;
            }

            /* Galleria: larga quasi quanto lo schermo e leggermente più in alto */
            .works-gallery {
                position: fixed;
                left: 3vw;
                right: 3vw;
                bottom: 28% !important;
                width: auto;
                max-width: none;
                height: 25vh;
                box-sizing: border-box;
                display: flex;
                gap: 4px;
                align-items: stretch;
            }

            /* Rettangoli uniformi quando sono chiusi */
            .works-gallery .work-rectangle,
            .works-gallery:hover .work-rectangle {
                flex: 1 1 0 !important;
                width: 0;
                min-width: 0;
            }

            /* Rettangolo selezionato espanso */
            .works-gallery .work-rectangle:hover,
            .works-gallery .work-rectangle.active {
                flex: 5 1 0 !important;
            }

            /* Altri rettangoli più stretti durante la selezione */
            .works-gallery:has(.work-rectangle:hover) .work-rectangle:not(:hover),
            .works-gallery:has(.work-rectangle.active) .work-rectangle:not(.active) {
                flex: 0.5 1 0 !important;
            }

            /* Frecce della galleria più in basso */
            .works-controls {
                bottom: 12% !important;
            }

            /* Fascia blu dietro al menu */
            .mobile-nav-band {
                display: block;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 90px;
                background-color: #146a9c;
                z-index: 999;
                pointer-events: none;
            }

            /* Cursore personalizzato nascosto su telefono */
            #custom-cursor {
                display: none !important;
                visibility: hidden !important;
                opacity: 0 !important;
                pointer-events: none !important;
            }

            /* Contenuto delle sottopagine */
            .project-page-content {
                width: 90%;
                gap: 28px;
                padding-top: 90px;
                padding-bottom: 40px;
            }

            #project-page-title {
                font-size: clamp(32px, 9vw, 60px);
            }

            .project-page-description {
                font-size: 24px;
            }

            #close-project-page {
                top: 10px;
                right: 10px;
            }

            .project-page-arrow {
                width: 36px;
                font-size: 24px;
            }

            #prev-project-page {
                left: 2px;
            }

            #next-project-page {
                right: 2px;
            }
        }
    </style>
</head>

<body>
    <div id="camera">
        <div id="scene">
            <main>
                <div class="works-title-container">
                    <div class="works-heading">
                        <h1 class="works-title">WORKS</h1>

                        <div class="scroll-prompt">
                            <img src="assets/Scroll/Frame_1.webp" alt="" class="scroll-frame frame-one">
                            <img src="assets/Scroll/Frame_2.webp" alt="" class="scroll-frame frame-two">
                        </div>
                    </div>

                    <div id="fisherman" aria-label="Pescatore">
                        <img src="assets/Pescatore/Fish_Idle/FishIdle01.png" alt="">
                    </div>
                </div>
            </main>

            <div class="works-gallery">
                <div class="work-rectangle">
                    <img src="images/work-1.jpg" alt="Hen on wheels">
                    <h2 class="work-title">Hen on wheels</h2>
                </div>

                <div class="work-rectangle">
                    <img src="images/work-2.jpg" alt="Adam's Animation Academy Final Exam">
                    <h2 class="work-title">Adam's Animation Academy Exam</h2>
                </div>

                <div class="work-rectangle">
                    <img src="images/work-3.jpg" alt="Awesomeland Project">
                    <h2 class="work-title">Awesomeland Project</h2>
                </div>

                <div class="work-rectangle">
                    <img src="images/work-4.jpg" alt="Cutout Works">
                    <h2 class="work-title">Cutout Works</h2>
                </div>

                <div class="work-rectangle">
                    <img src="images/work-5.jpg" alt="Rough It Down Final Exam">
                    <h2 class="work-title work-title-special">Rough It Down Final Exam</h2>
                </div>

                <div class="work-rectangle">
                    <img src="images/work-6.jpg" alt="Welcome to Lindenwood Lake">
                    <h2 class="work-title">Welcome to Lindenwood Lake</h2>
                </div>

                <div class="work-rectangle">
                    <img src="images/work-7.jpg" alt="All According to Plan">
                    <h2 class="work-title">All According to Plan</h2>
                </div>

                <div class="work-rectangle">
                    <img src="images/work-8.jpg" alt="Billy the Seed &amp; the Bad Nuts">
                    <h2 class="work-title">Billy the Seed &amp; the Bad Nuts</h2>
                </div>
            </div>

            <div class="works-controls">
                <button id="prev-project" aria-label="Progetto precedente">←</button>
                <button id="next-project" aria-label="Progetto successivo">→</button>
            </div>
        </div>
    </div>

    <button id="close-project-page" aria-label="Chiudi progetto">×</button>

    <button id="prev-project-page" class="project-page-arrow" aria-label="Progetto precedente">
        &#10094;
    </button>

    <button id="next-project-page" class="project-page-arrow" aria-label="Progetto successivo">
        &#10095;
    </button>

    <div id="project-page" aria-hidden="true">
        <div class="project-page-content">
            <h2 id="project-page-title"></h2>

            <div id="project-page-video" class="project-page-video">
                <!-- Player YouTube da inserire -->
            </div>

            <div id="project-page-description" class="project-page-description">
                <!-- Descrizione del progetto da inserire -->
            </div>
        </div>
    </div>

    <div class="mobile-nav-band" aria-hidden="true"></div>

    <nav class="navigation">
        <a href="index.html">HOME</a>
        <a href="works.html">WORKS</a>
        <a href="contact.html">CONTACT ME</a>
    </nav>

    <div id="custom-cursor" aria-hidden="true">✳</div>

    <script src="./custom-cursor.js"></script>
    <script src="click-sparks.js"></script>
    <script src="js/camera.js"></script>
    <script src="js/works-navigation.js"></script>
    <script src="js/fisherman.js"></script>
</body>
</html>
